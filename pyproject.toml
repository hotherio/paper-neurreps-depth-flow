[project]
name = "depthflow"
version = "1.0.0"
description = "The Depth Flow of Token Representations Is Nonlinear and Does Not Descend Its Own Density: reproduction code"
readme = "README.md"
license = "0BSD"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "torch>=2.4",
    "transformers>=4.45",
    "datasets>=3.0",
    "matplotlib>=3.9",
    "zstandard>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["depthflow"]

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "I", "B", "UP"]
lint.ignore = ["E731", "E741", "B905"]
